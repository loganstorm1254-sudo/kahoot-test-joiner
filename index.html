<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#46178f" />
    <meta name="color-scheme" content="light" />
    <title>Enter Game PIN - Kahoot!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        background: #46178f !important;
      }
    </style>
    <link rel="stylesheet" href="/styles.css?v=kahoot-decoy-v1" />
  </head>
  <body>
    <div id="view-decoy" class="view view-decoy">
      <main class="kahoot-page">
        <div class="kahoot-card">
          <div class="kahoot-logo" aria-label="Kahoot!">
            <span class="logo-k">K</span><span class="logo-a1">a</span><span class="logo-h">h</span
            ><span class="logo-o1">o</span><span class="logo-o2">o</span><span class="logo-t">t</span><span class="logo-bang">!</span>
          </div>

          <form id="decoy-form" class="kahoot-form" autocomplete="off">
            <label class="kahoot-label" for="decoy-pin">Game PIN</label>
            <input
              id="decoy-pin"
              class="kahoot-input kahoot-input-pin"
              type="text"
              inputmode="numeric"
              placeholder="123 456 7"
              maxlength="11"
              autocomplete="off"
            />

            <label class="kahoot-label" for="decoy-nickname">Nickname</label>
            <input
              id="decoy-nickname"
              class="kahoot-input"
              type="text"
              placeholder="Enter your nickname"
              maxlength="15"
              autocomplete="off"
            />

            <button id="decoy-enter" class="kahoot-button" type="submit">Enter</button>
          </form>

          <p id="decoy-status" class="kahoot-status" aria-live="polite"></p>
        </div>

        <p class="kahoot-footer-link">
          <a href="https://kahoot.it/" target="_blank" rel="noopener noreferrer">Want to host a game?</a>
        </p>
      </main>
    </div>

    <div id="view-joiner" class="view view-joiner is-hidden" hidden>
      <main class="joiner-page">
        <div class="joiner-card">
          <div class="joiner-header">
            <p class="joiner-eyebrow">Test joiner</p>
            <h1 class="joiner-title">Batch join</h1>
          </div>

          <form class="joiner-form" onsubmit="return false">
            <fieldset class="joiner-group">
              <legend class="joiner-legend">Game PIN</legend>
              <input id="pin" type="text" inputmode="numeric" placeholder="123 456" autocomplete="off" />
            </fieldset>

            <fieldset class="joiner-group">
              <legend class="joiner-legend">Base player name</legend>
              <input id="name" type="text" value="bot.locker-rover.dev" autocomplete="off" />
              <p class="joiner-note">
                Names become bot.locker-rover.dev1, bot.locker-rover.dev2… unless random names is on.
              </p>
            </fieldset>

            <fieldset class="joiner-group">
              <legend class="joiner-legend">Players to join</legend>
              <div class="count-control">
                <input id="count" type="range" min="1" max="44" value="1" aria-label="Players to join" />
                <input
                  id="count-input"
                  type="number"
                  min="1"
                  max="44"
                  value="1"
                  inputmode="numeric"
                  aria-label="Number of players"
                />
              </div>
            </fieldset>

            <fieldset class="joiner-group joiner-group-options">
              <legend class="joiner-legend">Options</legend>
              <label class="option-row">
                <input id="random-names" type="checkbox" checked />
                <span>Random names</span>
              </label>
              <label class="option-row">
                <input id="auto-answer" type="checkbox" checked />
                <span>Auto-answer questions</span>
              </label>
            </fieldset>

            <div class="joiner-actions">
              <button id="join" type="button" class="button button-primary">Enter</button>
              <button id="disconnect" type="button" class="button button-secondary" disabled>Leave all</button>
            </div>
          </form>

          <p id="status" class="status">Enter a PIN to join</p>
          <p id="quiz-result" class="quiz-result" hidden></p>
          <p id="version-info" class="version-info">Checking version…</p>
        </div>
      </main>
    </div>

    <script type="module" src="/app.js?v=kahoot-decoy-v1"></script>
  </body>
</html>
