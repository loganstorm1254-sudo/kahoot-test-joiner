<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kahoot Test Joiner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <header class="brand">
        <span class="logo">kahoot!</span>
        <p class="subtitle">Test joiner — for testing only</p>
      </header>

      <label for="pin">Game PIN</label>
      <input id="pin" type="text" inputmode="numeric" placeholder="123456" autocomplete="off" />

      <label for="name">Base player name</label>
      <input id="name" type="text" value="test" autocomplete="off" />
      <p class="hint">Names become test1, test2, test3… unless random names is on</p>

      <div class="count-row">
        <label for="count">Players to join</label>
        <strong id="count-label">1</strong>
      </div>
      <input id="count" type="range" min="1" max="100" value="1" />

      <div class="options">
        <label class="checkbox-row">
          <input id="random-names" type="checkbox" checked />
          <span>Random names</span>
        </label>
        <label class="checkbox-row">
          <input id="auto-answer" type="checkbox" checked />
          <span>Auto-answer questions</span>
        </label>
      </div>

      <button id="join" type="button" class="btn-primary">Enter</button>
      <button id="disconnect" type="button" class="btn-secondary" disabled>Leave all</button>

      <p id="status" class="status">Enter a PIN to join</p>
      <p id="quiz-result" class="quiz-result" hidden></p>
      <p id="version-info" class="version-info">Checking version…</p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
