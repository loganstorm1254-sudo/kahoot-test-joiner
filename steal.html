<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PLEASE DON'T STEAL!</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        color: #000;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 24px 16px 40px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 20px;
        text-align: center;
        font-size: clamp(32px, 8vw, 72px);
        font-weight: 900;
        letter-spacing: 0.05em;
        line-height: 1.05;
        text-transform: uppercase;
      }
      .video-wrap {
        width: min(100%, 960px);
        aspect-ratio: 16 / 9;
        background: #000;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>please dont steal!</h1>
      <div class="video-wrap">
        <iframe
          src="https://www.youtube.com/embed/aYOupakKb4c?autoplay=1&mute=0&playsinline=1"
          title="please dont steal"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </main>
  </body>
</html>
