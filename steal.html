<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>YOU THOUGHT YOU COULD STEAL?</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        overflow: hidden;
        height: 100%;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
      h1 {
        margin: 28px 16px 18px;
        text-align: center;
        font-size: clamp(28px, 7vw, 72px);
        font-weight: 900;
        letter-spacing: 0.04em;
        line-height: 1.05;
        color: #000000;
        text-transform: uppercase;
      }
      .video-wrap {
        position: relative;
        width: min(100vw, 960px);
        max-height: 70vh;
        background: #000;
      }
      video {
        display: block;
        width: 100%;
        max-height: 70vh;
        background: #000;
        pointer-events: none;
      }
      .video-block {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>YOU THOUGHT YOU COULD STEAL?</h1>
      <div class="video-wrap">
        <video
          id="v"
          src="/assets/you-thought.mp4"
          autoplay
          playsinline
          webkit-playsinline
          loop
          preload="auto"
        ></video>
        <div class="video-block" aria-hidden="true"></div>
      </div>
    </main>
    <script>
      (function () {
        const video = document.getElementById("v");
        if (!video) {
          return;
        }
        video.controls = false;
        video.loop = true;
        video.volume = 1;
        video.muted = false;

        const play = () => {
          video.muted = false;
          video.volume = 1;
          const result = video.play();
          if (result && typeof result.catch === "function") {
            result.catch(() => {
              video.muted = true;
              video.play().then(() => {
                video.muted = false;
                video.volume = 1;
              }).catch(() => {});
            });
          }
        };

        play();
        video.addEventListener("pause", () => {
          if (!video.ended) {
            requestAnimationFrame(play);
          }
        });
        video.addEventListener("ended", () => {
          video.currentTime = 0;
          play();
        });
        document.addEventListener(
          "pointerdown",
          () => {
            video.muted = false;
            video.volume = 1;
            play();
          },
          true,
        );
        document.addEventListener(
          "contextmenu",
          (event) => {
            event.preventDefault();
            return false;
          },
          true,
        );
        setInterval(() => {
          if (video.paused) {
            play();
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
