<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PLEASE DON'T STEAL!</title>
    <link rel="preload" href="/assets/please-dont-steal.mp4" as="video" type="video/mp4" />
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        overflow: hidden;
        height: 100%;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        color: #000;
        user-select: none;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
      h1 {
        margin: 20px 16px 14px;
        text-align: center;
        font-size: clamp(28px, 7vw, 64px);
        font-weight: 900;
        letter-spacing: 0.05em;
        line-height: 1.05;
        text-transform: uppercase;
      }
      .video-wrap {
        position: relative;
        width: min(100vw, 960px);
        max-height: 75vh;
        background: #000;
      }
      video {
        display: block;
        width: 100%;
        max-height: 75vh;
        background: #000;
      }
      #sound-hint {
        margin: 14px 16px 0;
        padding: 10px 18px;
        border: 3px solid #000;
        font-size: clamp(16px, 3.5vw, 22px);
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        animation: pulse 1.2s ease-in-out infinite;
      }
      #sound-hint.is-hidden {
        display: none;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>please dont steal!</h1>
      <div class="video-wrap">
        <video
          id="v"
          src="/assets/please-dont-steal.mp4"
          autoplay
          muted
          playsinline
          webkit-playsinline
          loop
          preload="auto"
        ></video>
      </div>
      <button id="sound-hint" type="button">tap for sound</button>
    </main>
    <script>
      (function () {
        var video = document.getElementById("v");
        var hint = document.getElementById("sound-hint");
        if (!video) return;

        var fromGesture = /(?:^|[?&])g=1(?:&|$)/.test(String(location.search || ""));
        var soundOn = false;
        var booting = false;

        video.controls = false;
        video.loop = true;
        video.playsInline = true;
        video.volume = 1;

        function hideHint() {
          if (hint) {
            hint.classList.add("is-hidden");
          }
        }

        function showHint() {
          if (hint && !soundOn) {
            hint.classList.remove("is-hidden");
          }
        }

        function playLoud() {
          video.muted = false;
          video.volume = 1;
          return video.play().then(function () {
            soundOn = true;
            hideHint();
          });
        }

        function playSafe() {
          video.muted = true;
          return video.play();
        }

        function boot() {
          if (booting) return;
          booting = true;
          var done = function () {
            booting = false;
          };

          if (fromGesture) {
            playLoud().catch(function () {
              playSafe().then(showHint).finally(done);
            });
            return;
          }

          playSafe()
            .then(function () {
              return playLoud();
            })
            .catch(function () {
              showHint();
            })
            .finally(done);
        }

        function unlockSound() {
          fromGesture = true;
          playLoud().catch(function () {
            playSafe().then(showHint);
          });
        }

        boot();
        video.addEventListener("loadeddata", boot, { once: true });

        if (hint) {
          hint.addEventListener("click", unlockSound);
        }
        document.addEventListener("pointerdown", unlockSound, { once: true, capture: true });
      })();
    </script>
  </body>
</html>
