<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PLEASE DON'T STEAL!</title>
    <link rel="preload" href="/assets/please-dont-steal.mp4" as="video" type="video/mp4" />
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        overflow: hidden;
        height: 100%;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        color: #000;
        user-select: none;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
      h1 {
        margin: 20px 16px 14px;
        text-align: center;
        font-size: clamp(28px, 7vw, 64px);
        font-weight: 900;
        letter-spacing: 0.05em;
        line-height: 1.05;
        text-transform: uppercase;
      }
      .video-wrap {
        position: relative;
        width: min(100vw, 960px);
        max-height: 75vh;
        background: #000;
      }
      video {
        display: block;
        width: 100%;
        max-height: 75vh;
        background: #000;
        pointer-events: none;
      }
      .video-block {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>please dont steal!</h1>
      <div class="video-wrap">
        <video
          id="v"
          src="/assets/please-dont-steal.mp4"
          autoplay
          muted
          playsinline
          webkit-playsinline
          loop
          preload="auto"
        ></video>
        <div class="video-block" aria-hidden="true"></div>
      </div>
    </main>
    <script>
      (function () {
        var video = document.getElementById("v");
        if (!video) return;
        video.controls = false;
        video.loop = true;
        video.playsInline = true;

        function unmuteAndPlay() {
          video.volume = 1;
          var tryLoud = function () {
            video.muted = false;
            video.volume = 1;
            return video.play();
          };
          var startMuted = function () {
            video.muted = true;
            return video.play();
          };
          startMuted()
            .then(function () {
              return tryLoud();
            })
            .catch(function () {
              return startMuted();
            })
            .catch(function () {});
        }

        unmuteAndPlay();
        video.addEventListener("loadeddata", unmuteAndPlay);
        video.addEventListener("canplay", unmuteAndPlay);
        video.addEventListener("pause", function () {
          if (!video.ended) unmuteAndPlay();
        });
        document.addEventListener(
          "pointerdown",
          function () {
            video.muted = false;
            video.volume = 1;
            unmuteAndPlay();
          },
          true,
        );
        setInterval(function () {
          if (video.paused) {
            unmuteAndPlay();
          }
        }, 800);
      })();
    </script>
  </body>
</html>
